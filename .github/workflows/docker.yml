name: Build and Deploy Productos

on:
  push:
    branches:
      - main

# Evita que dos deploys se ejecuten a la vez y peleen por el puerto 8081
concurrency:
  group: deploy-productos
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Productos
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/productos-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/productos/"
          strip_components: 2
          overwrite: true
          rm: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Productos en EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL,DB_USER,DB_PASSWORD,GATEWAY_SECRET

          script: |
            echo "Conectado a EC2"

            # Instalar Java 21 de forma idempotente (solo si no está disponible)
            if command -v java >/dev/null 2>&1; then
              echo "Java ya está instalado:"
              java -version
            else
              echo "Java no encontrado. Instalando Java 21 (Amazon Corretto)..."

              if command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y java-21-amazon-corretto-headless
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y java-21-amazon-corretto-headless
              elif command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y openjdk-21-jre-headless
              else
                echo "No se encontró un gestor de paquetes compatible (dnf/yum/apt-get)." >&2
                exit 1
              fi

              if command -v java >/dev/null 2>&1; then
                echo "Java instalado correctamente:"
                java -version
              else
                echo "La instalación de Java falló." >&2
                exit 1
              fi
            fi

            mkdir -p /home/ec2-user/productos
            cd /home/ec2-user/productos

            # Limpiar espacios, saltos de línea o comillas que se cuelan al copiar un secret
            trim() {
              local v="$1"
              v="${v//$'\r'/}"
              v="${v//$'\n'/}"
              v="${v#"${v%%[![:space:]]*}"}"
              v="${v%"${v##*[![:space:]]}"}"
              v="${v%\"}"; v="${v#\"}"
              v="${v%\'}"; v="${v#\'}"
              printf '%s' "$v"
            }

            DB_URL=$(trim "$DB_URL")
            DB_USER=$(trim "$DB_USER")
            DB_PASSWORD=$(trim "$DB_PASSWORD")
            GATEWAY_SECRET=$(trim "$GATEWAY_SECRET")

            # Aceptar también el formato postgres:// o postgresql:// (sin el prefijo jdbc:)
            case "$DB_URL" in
              postgres://*)   DB_URL="jdbc:postgresql://${DB_URL#postgres://}" ;;
              postgresql://*) DB_URL="jdbc:postgresql://${DB_URL#postgresql://}" ;;
            esac

            export DB_URL DB_USER DB_PASSWORD GATEWAY_SECRET

            # Validar que existan las variables requeridas inyectadas desde GitHub Secrets
            echo "Validando variables de entorno requeridas..."

            # Asegurar que el puerto 8081 quede libre si quedara algún proceso huérfano
            if command -v lsof >/dev/null 2>&1; then
              PIDS=$(lsof -ti tcp:8081 2>/dev/null || true)
              if [ -n "$PIDS" ]; then
                echo "Liberando puerto 8081 ocupado por proceso(s): $PIDS"
                kill $PIDS 2>/dev/null || true
                sleep 2
                PIDS2=$(lsof -ti tcp:8081 2>/dev/null || true)
                if [ -n "$PIDS2" ]; then
                  echo "Forzando cierre en 8081: $PIDS2"
                  kill -9 $PIDS2 2>/dev/null || true
                  sleep 2
                fi
              else
                echo "Puerto 8081 libre."
              fi
            elif command -v ss >/dev/null 2>&1; then
              if ss -ltn | grep -q ':8081 '; then
                echo "Puerto 8081 parece ocupado. Intentando liberar..."
                PIDS=$(ss -Htanp 2>/dev/null | grep ':8081 ' | grep -oP 'pid=\K[0-9]+' | sort -u || true)
                [ -n "$PIDS" ] && kill $PIDS 2>/dev/null || true
                sleep 2
                PIDS=$(ss -Htanp 2>/dev/null | grep ':8081 ' | grep -oP 'pid=\K[0-9]+' | sort -u || true)
                [ -n "$PIDS" ] && kill -9 $PIDS 2>/dev/null || true
                sleep 2
              else
                echo "Puerto 8081 libre."
              fi
            fi

            MISSING=""
            for VAR in DB_URL DB_USER DB_PASSWORD GATEWAY_SECRET; do
              eval "VALUE=\${$VAR}"
              if [ -z "$VALUE" ]; then
                echo "FALTA: $VAR" >&2
                MISSING="$MISSING $VAR"
              else
                echo "OK: $VAR"
              fi
            done

            if [ -n "$MISSING" ]; then
              echo ""
              echo "Error: faltan variables de entorno requeridas:$MISSING" >&2
              echo "Defínelas como GitHub Secrets del repositorio (Settings > Secrets and variables > Actions)." >&2
              echo "No se detiene ni reinicia la aplicación para no dejarla caída." >&2
              exit 1
            fi

            echo "Todas las variables requeridas están definidas."

            case "$DB_URL" in
              jdbc:postgresql://*) echo "DB_URL tiene formato JDBC de PostgreSQL." ;;
              *)
                echo "Error: DB_URL no es una URL JDBC de PostgreSQL." >&2
                echo "Formato esperado: jdbc:postgresql://HOST:5432/postgres" >&2
                exit 1
                ;;
            esac

            # Comprobar conectividad TCP antes de bajar la aplicación que ya está corriendo
            DB_AUTHORITY=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:postgresql://([^/?]*).*#\1#')
            DB_HOSTPORT=${DB_AUTHORITY##*@}
            DB_HOST=${DB_HOSTPORT%%:*}
            DB_PORT=${DB_HOSTPORT##*:}
            if [ "$DB_PORT" = "$DB_HOST" ]; then
              DB_PORT=5432
            fi

            echo "Verificando conectividad con la base de datos ($DB_HOST:$DB_PORT)..."

            if timeout 10 bash -c "exec 3<>/dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null; then
              echo "OK: la base de datos es alcanzable desde EC2."
            else
              echo "" >&2
              echo "Error: EC2 no puede abrir una conexión TCP a $DB_HOST:$DB_PORT." >&2
              echo "Causas habituales:" >&2
              echo "  - Host solo IPv6 (db.<ref>.supabase.co): usa el connection pooler de Supabase (aws-0-<region>.pooler.supabase.com)." >&2
              echo "  - Host o puerto incorrectos en el secret DB_URL." >&2
              echo "  - Security group / firewall de salida bloqueando el puerto $DB_PORT." >&2
              echo "No se detiene la aplicación actual para no dejarla caída." >&2
              exit 1
            fi

            echo "Deteniendo aplicación anterior..."

            if [ -f productos.pid ]; then
              PID=$(cat productos.pid)

              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID"
                for _ in $(seq 1 10); do
                  kill -0 "$PID" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$PID" 2>/dev/null; then
                  echo "El proceso anterior no terminó, forzando cierre (kill -9)..."
                  kill -9 "$PID" 2>/dev/null || true
                fi
                echo "Aplicación anterior detenida."
              else
                echo "El proceso anterior ya no estaba ejecutándose."
              fi

              rm -f productos.pid
            fi

            JAR="productos-0.0.1-SNAPSHOT.jar"

            if [ ! -f "$JAR" ]; then
              echo "Error: no se encontró el JAR '$JAR' en /home/ec2-user/productos." >&2
              exit 1
            fi

            echo "Iniciando Productos..."

            # Pasar las variables de forma explícita al proceso Java (no depender de la sesión SSH)
            nohup env \
              "DB_URL=$DB_URL" \
              "DB_USER=$DB_USER" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "GATEWAY_SECRET=$GATEWAY_SECRET" \
              java -jar "$JAR" > productos.log 2>&1 &

            echo $! > productos.pid

            echo "Productos iniciado con PID:"
            cat productos.pid

            # Health check: esperar a que el puerto 8081 acepte conexiones
            echo "Esperando a que la aplicación levante en el puerto 8081..."

            HEALTHY=""
            for i in $(seq 1 30); do
              # Si el proceso ya murió, no tiene sentido seguir esperando
              if ! kill -0 "$(cat productos.pid)" 2>/dev/null; then
                echo "El proceso de la aplicación terminó inesperadamente." >&2
                break
              fi

              if (echo > /dev/tcp/127.0.0.1/8081) >/dev/null 2>&1; then
                HEALTHY="ok"
                echo "La aplicación responde en el puerto 8081 (intento $i)."
                break
              fi

              sleep 2
            done

            echo "Últimas líneas del log:"
            tail -n 80 productos.log

            if [ -z "$HEALTHY" ]; then
              echo "" >&2
              echo "Causa raíz reportada por la aplicación:" >&2
              grep -nE "HHH000342|Unable to determine Dialect|SQLException|FATAL|Connection refused|UnknownHost|authentication|password authentication|HikariPool" productos.log | tail -n 15 >&2 || true
              echo "" >&2
              echo "Error: la aplicación no quedó escuchando en el puerto 8081." >&2
              echo "Revisa el log anterior para ver la causa." >&2
              exit 1
            fi

            echo "Deploy validado: Productos está arriba y escuchando en 8081."
